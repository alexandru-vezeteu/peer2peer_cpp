networks:
  p2p-net:
    driver: bridge

# ── Shared node defaults ──────────────────────────────────────────────────────
x-node: &node
  build:
    context: .
    dockerfile: node.dockerfile
  depends_on:
    coordinator:
      condition: service_healthy
  networks:
    - p2p-net
  restart: unless-stopped

services:

  # ── Coordinator ─────────────────────────────────────────────────────────────
  coordinator:
    build:
      context: .
      dockerfile: node.dockerfile
    container_name: p2p-coordinator
    command: coordinator --port 9000
    networks:
      - p2p-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9000"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s

  # ── Nodes ────────────────────────────────────────────────────────────────────
  # Each node runs in daemon mode so the control socket (/tmp/p2p.sock) is
  # available inside the container.
  #
  # To open an interactive shell on any node:
  #   docker exec -it p2p-node-01 /app/p2p shell
  #
  # Shell commands:
  #   /peers          — list connected peers
  #   /msg <n> <txt>  — send encrypted message to peer n
  #   /all <txt>      — broadcast to all peers
  #   /msgs           — show received messages
  #   /quit           — exit shell

  node-01:
    <<: *node
    container_name: p2p-node-01
    environment: { NODE_ID: "01" }
    command: daemon --port 9001 --coordinator coordinator:9000

  node-02:
    <<: *node
    container_name: p2p-node-02
    environment: { NODE_ID: "02" }
    command: daemon --port 9002 --coordinator coordinator:9000

  node-03:
    <<: *node
    container_name: p2p-node-03
    environment: { NODE_ID: "03" }
    command: daemon --port 9003 --coordinator coordinator:9000

  node-04:
    <<: *node
    container_name: p2p-node-04
    environment: { NODE_ID: "04" }
    command: daemon --port 9004 --coordinator coordinator:9000

  node-05:
    <<: *node
    container_name: p2p-node-05
    environment: { NODE_ID: "05" }
    command: daemon --port 9005 --coordinator coordinator:9000

  node-06:
    <<: *node
    container_name: p2p-node-06
    environment: { NODE_ID: "06" }
    command: daemon --port 9006 --coordinator coordinator:9000

  node-07:
    <<: *node
    container_name: p2p-node-07
